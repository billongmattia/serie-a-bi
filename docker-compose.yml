services:
  mysql:
    image: mysql:8.4
    container_name: serie_a_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-serie_a}
      MYSQL_USER: ${MYSQL_USER:-serie_a}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-serie_a_pw}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_staging.sql:/docker-entrypoint-initdb.d/01_staging.sql:ro
      - ./sql/02_star_schema.sql:/docker-entrypoint-initdb.d/02_star_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
